<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fillIcon { fill: #a8dc66; stroke: none; }
    .strokeIcon { fill: none; stroke: #a8dc66; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <defs>
    <g id="ic-pin">
      <path class="fillIcon" d="M0,-38 C15,-38 27,-26 27,-11 C27,10 0,42 0,42 C0,42 -27,10 -27,-11 C-27,-26 -15,-38 0,-38 Z"/>
      <circle cx="0" cy="-10" r="9" fill="#ffffff"/>
    </g>

    <g id="ic-pinflag">
      <line class="strokeIcon" x1="0" y1="38" x2="0" y2="-38" stroke-width="4"/>
      <path class="fillIcon" d="M0,-38 L30,-27 L0,-16 Z"/>
      <circle class="fillIcon" cx="0" cy="38" r="6"/>
    </g>

    <g id="ic-compass">
      <circle class="strokeIcon" cx="0" cy="0" r="34"/>
      <line class="strokeIcon" x1="0" y1="-34" x2="0" y2="-24" stroke-width="4"/>
      <line class="strokeIcon" x1="0" y1="34" x2="0" y2="24" stroke-width="4"/>
      <line class="strokeIcon" x1="-34" y1="0" x2="-24" y2="0" stroke-width="4"/>
      <line class="strokeIcon" x1="34" y1="0" x2="24" y2="0" stroke-width="4"/>
      <path class="fillIcon" d="M0,-18 L7,0 L0,18 L-7,0 Z"/>
    </g>

    <g id="ic-footprints">
      <ellipse class="fillIcon" cx="-16" cy="10" rx="12" ry="24" transform="rotate(-10 -16 10)"/>
      <circle class="fillIcon" cx="-24" cy="-14" r="3.5"/>
      <circle class="fillIcon" cx="-15" cy="-18" r="3.5"/>
      <circle class="fillIcon" cx="-6" cy="-15" r="3.5"/>
      <ellipse class="fillIcon" cx="16" cy="-22" rx="12" ry="24" transform="rotate(10 16 -22)"/>
      <circle class="fillIcon" cx="8" cy="-46" r="3.5"/>
      <circle class="fillIcon" cx="17" cy="-49" r="3.5"/>
      <circle class="fillIcon" cx="26" cy="-45" r="3.5"/>
    </g>

    <g id="ic-map">
      <rect class="strokeIcon" x="-36" y="-24" width="72" height="48" rx="4"/>
      <line class="strokeIcon" x1="-12" y1="-24" x2="-12" y2="24" stroke-dasharray="4 5" stroke-width="3"/>
      <line class="strokeIcon" x1="12" y1="-24" x2="12" y2="24" stroke-dasharray="4 5" stroke-width="3"/>
      <path class="strokeIcon" d="M-24,14 C-10,4 4,4 20,-12" stroke-width="3" stroke-dasharray="1 6"/>
      <path class="strokeIcon" d="M18,-20 L26,-12 M26,-20 L18,-12" stroke-width="4"/>
    </g>

    <g id="ic-signal">
      <circle class="fillIcon" cx="-14" cy="20" r="5"/>
      <path class="strokeIcon" d="M-4,10 Q12,10 12,-6" stroke-width="4"/>
      <path class="strokeIcon" d="M-10,16 Q20,16 20,-14" stroke-width="4"/>
      <path class="strokeIcon" d="M-16,22 Q28,22 28,-22" stroke-width="4"/>
    </g>

    <g id="ic-search">
      <circle class="strokeIcon" cx="-6" cy="-6" r="20"/>
      <line class="strokeIcon" x1="9" y1="9" x2="30" y2="30" stroke-width="5"/>
      <path class="fillIcon" d="M-6,-16 C-2,-16 2,-12 2,-8 C2,-2 -6,10 -6,10 C-6,10 -14,-2 -14,-8 C-14,-12 -10,-16 -6,-16 Z"/>
      <circle cx="-6" cy="-8" r="3" fill="#ffffff"/>
    </g>

    <g id="ic-target">
      <circle class="strokeIcon" cx="0" cy="0" r="32"/>
      <circle class="strokeIcon" cx="0" cy="0" r="20"/>
      <circle class="strokeIcon" cx="0" cy="0" r="8"/>
      <circle class="fillIcon" cx="0" cy="0" r="3"/>
    </g>

    <g id="ic-mountain">
      <path class="strokeIcon" d="M-42,22 L-22,-14 L-6,6 L14,-32 L42,22 Z" stroke-width="5"/>
      <line class="strokeIcon" x1="14" y1="-32" x2="14" y2="-58" stroke-width="4"/>
      <path class="fillIcon" d="M14,-58 L36,-50 L14,-42 Z"/>
    </g>
  </defs>

  <!-- winding "thread" connecting locations -->
  <path d="M130,150 C300,300 250,500 400,550 C550,600 500,750 650,800 C800,850 900,700 950,500 C1000,300 1150,250 1300,350 C1450,450 1400,600 1500,700"
        fill="none" stroke="#a8dc66" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.8"/>
  <circle cx="300" cy="300" r="5" class="fillIcon"/>
  <circle cx="650" cy="800" r="5" class="fillIcon"/>
  <circle cx="1150" cy="250" r="5" class="fillIcon"/>

  <!-- scattered doodle icons -->
  <use href="#ic-pin"        xlink:href="#ic-pin"        transform="translate(130,150)  rotate(-8)  scale(1.1)"/>
  <use href="#ic-compass"    xlink:href="#ic-compass"    transform="translate(430,110)  rotate(10)  scale(0.9)"/>
  <use href="#ic-map"        xlink:href="#ic-map"        transform="translate(760,180)  rotate(-5)  scale(1.0)"/>
  <use href="#ic-pinflag"    xlink:href="#ic-pinflag"    transform="translate(1080,130) rotate(12)  scale(1.0)"/>
  <use href="#ic-signal"     xlink:href="#ic-signal"     transform="translate(1380,190) rotate(-10) scale(1.1)"/>

  <use href="#ic-footprints" xlink:href="#ic-footprints" transform="translate(90,430)   rotate(15)  scale(0.8)"/>
  <use href="#ic-target"     xlink:href="#ic-target"     transform="translate(380,400)  rotate(0)   scale(0.9)"/>
  <use href="#ic-mountain"   xlink:href="#ic-mountain"   transform="translate(660,460)  rotate(-6)  scale(0.85)"/>
  <use href="#ic-search"     xlink:href="#ic-search"     transform="translate(950,410)  rotate(8)   scale(1.0)"/>
  <use href="#ic-pin"        xlink:href="#ic-pin"        transform="translate(1230,450) rotate(18)  scale(0.9)"/>
  <use href="#ic-compass"    xlink:href="#ic-compass"    transform="translate(1500,400) rotate(-14) scale(0.8)"/>

  <use href="#ic-pinflag"    xlink:href="#ic-pinflag"    transform="translate(160,700)  rotate(-10) scale(1.1)"/>
  <use href="#ic-signal"     xlink:href="#ic-signal"     transform="translate(440,730)  rotate(5)   scale(0.9)"/>
  <use href="#ic-footprints" xlink:href="#ic-footprints" transform="translate(720,690)  rotate(-20) scale(0.9)"/>
  <use href="#ic-map"        xlink:href="#ic-map"        transform="translate(1000,740) rotate(10)  scale(0.95)"/>
  <use href="#ic-target"     xlink:href="#ic-target"     transform="translate(1280,700) rotate(-8)  scale(1.0)"/>
  <use href="#ic-mountain"   xlink:href="#ic-mountain"   transform="translate(1500,760) rotate(6)   scale(0.8)"/>

  <use href="#ic-search"     xlink:href="#ic-search"     transform="translate(250,930)  rotate(-6)  scale(0.85)"/>
  <use href="#ic-pin"        xlink:href="#ic-pin"        transform="translate(600,900)  rotate(10)  scale(1.0)"/>
  <use href="#ic-pinflag"    xlink:href="#ic-pinflag"    transform="translate(950,930)  rotate(-12) scale(0.9)"/>
  <use href="#ic-compass"    xlink:href="#ic-compass"    transform="translate(1250,900) rotate(5)   scale(0.85)"/>
</svg>
